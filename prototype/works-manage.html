<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鼠鼠工坊 - 作品管理</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7fa;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        .section-card {
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #333;
        }
        .form-item {
            margin-bottom: 16px;
        }
        .form-item .label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            display: block;
        }
        .form-item .input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-item .picker {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background-color: white;
        }
        .uploader {
            width: 100px;
            height: 100px;
            border: 2px dashed #e0e0e0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
        }
        .uploader:hover {
            border-color: #ff8800;
        }
        .uploader .preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .upload-placeholder {
            color: #999;
            font-size: 14px;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #ff8800, #ffaa00);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .work-item {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .work-item:last-child {
            border-bottom: none;
        }
        .work-cover {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 12px;
        }
        .work-meta {
            flex: 1;
        }
        .work-meta .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .work-meta .title {
            font-weight: 500;
            font-size: 15px;
        }
        .work-meta .status {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .work-meta .status.on {
            background-color: #f6ffed;
            color: #52c41a;
        }
        .work-meta .status.off {
            background-color: #f5f5f5;
            color: #999;
        }
        .work-meta .desc, .work-meta .meta {
            font-size: 13px;
            color: #666;
            margin-bottom: 2px;
        }
        .work-meta .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }
        .switch-wrap {
            display: flex;
            align-items: center;
        }
        .switch-label {
            font-size: 12px;
            color: #666;
            margin-right: 8px;
        }
        .btn-small {
            padding: 4px 12px;
            font-size: 12px;
            border: 1px solid #ff4d4f;
            color: #ff4d4f;
            background: white;
            border-radius: 4px;
            cursor: pointer;
        }
        .toggle-switch {
            position: relative;
            width: 44px;
            height: 22px;
            background-color: #ccc;
            border-radius: 11px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .toggle-switch.active {
            background-color: #ff8800;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }
        .toggle-switch.active::after {
            transform: translateX(22px);
        }
        .empty {
            text-align: center;
            padding: 40px 0;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="flex flex-col h-full">
        <!-- 顶部导航 -->
        <div class="bg-gradient-to-r from-yellow-500 to-orange-500 p-4 flex items-center justify-between shadow-sm text-white">
            <div class="flex items-center">
                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                <h1 class="text-lg font-medium">作品管理</h1>
            </div>
        </div>
        
        <!-- 内容区域 -->
        <div class="p-4 flex-grow overflow-auto">
            <!-- 新增作品 -->
            <div class="section-card">
                <div class="section-title">新增作品</div>
                
                <div class="form-item">
                    <span class="label">角色名称</span>
                    <input class="input" placeholder="请输入角色名称" value="小狐狸头壳" />
                </div>
                
                <div class="form-item">
                    <span class="label">来源</span>
                    <input class="input" placeholder="填写作品来源/系列" value="原创设计" />
                </div>
                
                <div class="form-item">
                    <span class="label">参考价格</span>
                    <input class="input" type="number" placeholder="示例：999 或 999.00" value="2999" />
                </div>
                
                <div class="form-item">
                    <span class="label">分类</span>
                    <select class="picker">
                        <option value="original">自设角色</option>
                        <option value="anime">动漫角色</option>
                        <option value="game">游戏角色</option>
                        <option value="other">其他</option>
                    </select>
                </div>
                
                <div class="form-item">
                    <div class="flex justify-between items-center">
                        <span class="label" style="margin-bottom: 0;">是否上架</span>
                        <div class="toggle-switch active"></div>
                    </div>
                </div>
                
                <div class="form-item">
                    <span class="label">封面图</span>
                    <div class="uploader">
                        <img class="preview" src="../icon.png" alt="封面预览" />
                    </div>
                </div>
                
                <button class="btn-primary">保存作品</button>
            </div>
            
            <!-- 作品列表 -->
            <div class="section-card">
                <div class="section-title">作品列表</div>
                
                <!-- 作品项1 -->
                <div class="work-item">
                    <img class="work-cover" src="../icon.png" alt="狐狸头壳" />
                    <div class="work-meta">
                        <div class="title-row">
                            <span class="title">狐狸头壳</span>
                            <span class="status on">已上架</span>
                        </div>
                        <div class="desc">来源：原创设计</div>
                        <div class="meta">参考价格：2999</div>
                        <div class="meta">分类：自设角色 ｜ 时间：2026-01-15</div>
                        <div class="actions">
                            <div class="switch-wrap">
                                <span class="switch-label">上架</span>
                                <div class="toggle-switch active"></div>
                            </div>
                            <button class="btn-small">删除</button>
                        </div>
                    </div>
                </div>
                
                <!-- 作品项2 -->
                <div class="work-item">
                    <img class="work-cover" src="../icon.png" alt="猫咪头壳" />
                    <div class="work-meta">
                        <div class="title-row">
                            <span class="title">猫咪头壳</span>
                            <span class="status on">已上架</span>
                        </div>
                        <div class="desc">来源：动漫角色</div>
                        <div class="meta">参考价格：3299</div>
                        <div class="meta">分类：动漫角色 ｜ 时间：2026-01-10</div>
                        <div class="actions">
                            <div class="switch-wrap">
                                <span class="switch-label">上架</span>
                                <div class="toggle-switch active"></div>
                            </div>
                            <button class="btn-small">删除</button>
                        </div>
                    </div>
                </div>
                
                <!-- 作品项3 -->
                <div class="work-item">
                    <img class="work-cover" src="../icon.png" alt="兔子头壳" />
                    <div class="work-meta">
                        <div class="title-row">
                            <span class="title">兔子头壳</span>
                            <span class="status off">未上架</span>
                        </div>
                        <div class="desc">来源：游戏角色</div>
                        <div class="meta">参考价格：2599</div>
                        <div class="meta">分类：游戏角色 ｜ 时间：2026-01-05</div>
                        <div class="actions">
                            <div class="switch-wrap">
                                <span class="switch-label">上架</span>
                                <div class="toggle-switch"></div>
                            </div>
                            <button class="btn-small">删除</button>
                        </div>
                    </div>
                </div>
                
                <!-- 作品项4 -->
                <div class="work-item">
                    <img class="work-cover" src="../icon.png" alt="熊猫头壳" />
                    <div class="work-meta">
                        <div class="title-row">
                            <span class="title">熊猫头壳</span>
                            <span class="status on">已上架</span>
                        </div>
                        <div class="desc">来源：原创设计</div>
                        <div class="meta">参考价格：3599</div>
                        <div class="meta">分类：自设角色 ｜ 时间：2025-12-20</div>
                        <div class="actions">
                            <div class="switch-wrap">
                                <span class="switch-label">上架</span>
                                <div class="toggle-switch active"></div>
                            </div>
                            <button class="btn-small">删除</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
