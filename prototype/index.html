<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鼠鼠工坊小程序原型</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }
        .header-title {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ff9900, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            display: inline-block;
        }
        .header-subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 20px;
        }
        .mascot {
            width: 80px;
            height: 80px;
            margin-right: 15px;
            vertical-align: middle;
        }
        .phone-container {
            width: 390px;
            height: 844px;
            background: white;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            position: relative;
            margin: 20px;
            display: inline-block;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .phone-container:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background: black;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            z-index: 10;
        }
        .phone-frame {
            width: 100%;
            height: 100%;
            border: 12px solid black;
            border-radius: 40px;
            box-sizing: border-box;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .screen-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.2rem;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .screen-icon {
            width: 30px;
            height: 30px;
            margin-right: 8px;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
        }
        .decoration {
            position: absolute;
            width: 150px;
            height: 150px;
            opacity: 0.1;
            z-index: -1;
        }
        .decoration-1 {
            top: 10%;
            left: 5%;
            transform: rotate(-15deg);
        }
        .decoration-2 {
            bottom: 10%;
            right: 5%;
            transform: rotate(15deg);
        }
        .section-title {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 40px 0 20px;
            text-align: center;
            color: #444;
        }
        .section-description {
            text-align: center;
            max-width: 800px;
            margin: 0 auto 30px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="../icon.png" alt="鼠鼠工坊" class="mascot">
        <h1 class="header-title">鼠鼠工坊小程序原型</h1>
        <p class="header-subtitle">专注于Kigurumi头壳制作的工作室</p>
        
        <img src="../icon.png" alt="装饰" class="decoration decoration-1">
        <img src="../icon.png" alt="装饰" class="decoration decoration-2">
    </div>
    
    <!-- 用户端页面 -->
    <div class="section-title">用户端页面</div>
    <p class="section-description">用户可以查询订单进度、浏览作品展示和管理个人订单</p>
    
    <div class="flex flex-wrap justify-center">
        <!-- 首页 -->
        <div class="flex flex-col items-center">
            <div class="screen-title">
                <img src="../icon.png" alt="首页" class="screen-icon">
                首页
            </div>
            <div class="phone-container">
                <div class="phone-notch"></div>
                <div class="phone-frame">
                    <iframe src="home.html"></iframe>
                </div>
            </div>
        </div>
        
        <!-- 作品展示页 -->
        <div class="flex flex-col items-center">
            <div class="screen-title">
                <img src="../icon.png" alt="作品展示" class="screen-icon">
                作品展示
            </div>
            <div class="phone-container">
                <div class="phone-notch"></div>
                <div class="phone-frame">
                    <iframe src="works.html"></iframe>
                </div>
            </div>
        </div>
        
        <!-- 订单详情页 -->
        <div class="flex flex-col items-center">
            <div class="screen-title">
                <img src="../icon.png" alt="订单详情" class="screen-icon">
                订单详情
            </div>
            <div class="phone-container">
                <div class="phone-notch"></div>
                <div class="phone-frame">
                    <iframe src="order-detail.html"></iframe>
                </div>
            </div>
        </div>
        
        <!-- 个人中心（已登录） -->
        <div class="flex flex-col items-center">
            <div class="screen-title">
                <img src="../icon.png" alt="个人中心" class="screen-icon">
                个人中心（已登录）
            </div>
            <div class="phone-container">
                <div class="phone-notch"></div>
                <div class="phone-frame">
                    <iframe src="profile.html"></iframe>
                </div>
            </div>
        </div>
        
        <!-- 个人中心（未登录） -->
        <div class="flex flex-col items-center">
            <div class="screen-title">
                <img src="../icon.png" alt="未登录" class="screen-icon">
                个人中心（未登录）
            </div>
            <div class="phone-container">
                <div class="phone-notch"></div>
                <div class="phone-frame">
                    <iframe src="profile-unlogin.html"></iframe>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 管理员端页面 -->
    <div class="section-title">管理员端页面</div>
    <p class="section-description">管理员可以查看和管理所有未完成订单，更新订单状态</p>
    
    <div class="flex flex-wrap justify-center">
        <!-- 管理员后台 -->
        <div class="flex flex-col items-center">
            <div class="screen-title">
                <img src="../icon.png" alt="管理员后台" class="screen-icon">
                管理员后台
            </div>
            <div class="phone-container">
                <div class="phone-notch"></div>
                <div class="phone-frame">
                    <iframe src="admin.html"></iframe>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        © 2025 鼠鼠工坊 - 原型设计展示
    </div>
</body>
</html>
