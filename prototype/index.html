<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鼠鼠工坊小程序原型</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            padding: 20px;
        }
        .phone-container {
            width: 390px;
            height: 844px;
            background: white;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            margin: 20px;
            display: inline-block;
        }
        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background: black;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            z-index: 10;
        }
        .phone-frame {
            width: 100%;
            height: 100%;
            border: 12px solid black;
            border-radius: 40px;
            box-sizing: border-box;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .screen-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <h1 class="text-3xl font-bold text-center my-6">鼠鼠工坊小程序原型</h1>
    
    <div class="flex flex-wrap justify-center">
        <!-- 首页 -->
        <div class="flex flex-col items-center">
            <div class="screen-title">首页</div>
            <div class="phone-container">
                <div class="phone-notch"></div>
                <div class="phone-frame">
                    <iframe src="home.html"></iframe>
                </div>
            </div>
        </div>
        
        <!-- 订单详情页 -->
        <div class="flex flex-col items-center">
            <div class="screen-title">订单详情</div>
            <div class="phone-container">
                <div class="phone-notch"></div>
                <div class="phone-frame">
                    <iframe src="order-detail.html"></iframe>
                </div>
            </div>
        </div>
        
        <!-- 个人中心（已登录） -->
        <div class="flex flex-col items-center">
            <div class="screen-title">个人中心（已登录）</div>
            <div class="phone-container">
                <div class="phone-notch"></div>
                <div class="phone-frame">
                    <iframe src="profile.html"></iframe>
                </div>
            </div>
        </div>
        
        <!-- 个人中心（未登录） -->
        <div class="flex flex-col items-center">
            <div class="screen-title">个人中心（未登录）</div>
            <div class="phone-container">
                <div class="phone-notch"></div>
                <div class="phone-frame">
                    <iframe src="profile-unlogin.html"></iframe>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
