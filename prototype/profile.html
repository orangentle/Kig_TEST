<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鼠鼠工坊 - 个人中心</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f0f0;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
        }
        .nav-item svg {
            margin-bottom: 4px;
        }
        .active {
            color: #0052d9;
        }
        .order-status {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .status-processing {
            background-color: #e6f7ff;
            color: #1890ff;
        }
        .status-completed {
            background-color: #f6ffed;
            color: #52c41a;
        }
    </style>
</head>
<body>
    <div class="flex flex-col h-full">
        <!-- 顶部个人信息 -->
        <div class="bg-white p-6">
            <div class="flex items-center">
                <img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" alt="用户头像" class="w-16 h-16 rounded-full mr-4">
                <div>
                    <h2 class="text-lg font-medium">喵喵用户</h2>
                    <p class="text-gray-500">ID: 123456</p>
                </div>
            </div>
        </div>
        
        <!-- 订单列表 -->
        <div class="p-4 flex-grow">
            <h2 class="text-lg font-medium mb-3">我的订单</h2>
            
            <div class="bg-white rounded-lg shadow-sm p-4 mb-3">
                <div class="flex justify-between items-center mb-2">
                    <div class="font-medium">订单号: TB123456789</div>
                    <div class="order-status status-processing">制作中</div>
                </div>
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-sm text-gray-500">角色: 狐狸头壳</p>
                        <p class="text-sm text-gray-500">下单时间: 2023-10-15</p>
                    </div>
                    <div class="text-blue-600">查看详情</div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow-sm p-4 mb-3">
                <div class="flex justify-between items-center mb-2">
                    <div class="font-medium">订单号: TB987654321</div>
                    <div class="order-status status-completed">已完成</div>
                </div>
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-sm text-gray-500">角色: 猫咪头壳</p>
                        <p class="text-sm text-gray-500">下单时间: 2023-09-01</p>
                    </div>
                    <div class="text-blue-600">查看详情</div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow-sm p-4 mb-3">
                <div class="flex justify-between items-center mb-2">
                    <div class="font-medium">订单号: TB456789123</div>
                    <div class="order-status status-completed">已完成</div>
                </div>
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-sm text-gray-500">角色: 兔子头壳</p>
                        <p class="text-sm text-gray-500">下单时间: 2023-08-15</p>
                    </div>
                    <div class="text-blue-600">查看详情</div>
                </div>
            </div>
        </div>
        
        <!-- 底部导航栏 -->
        <div class="bg-white border-t flex justify-around py-2">
            <div class="nav-item text-gray-500">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
                </svg>
                首页
            </div>
            <div class="nav-item active">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
                </svg>
                我的
            </div>
        </div>
    </div>
</body>
</html>
